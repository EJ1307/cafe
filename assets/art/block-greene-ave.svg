  <rect x="18" y="18" width="414" height="244" fill="url(#speck)"/>
  <text x="18" y="284" font-family="Georgia, serif" font-style="italic" font-size="8" fill="#8A8273">AP</text>
  <text x="432" y="284" text-anchor="end" font-family="Georgia, serif" font-style="italic" font-size="8" fill="#8A8273">G. Oyelaran ’26</text>
