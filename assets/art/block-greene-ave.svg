<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 300">
  <title>Greene Avenue, Four O’Clock — woodblock print by Grace Oyelaran</title>
  <defs>
    <filter id="wood" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="8"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <pattern id="grain" width="40" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 2C10 1 20 3 40 2M0 5C14 4 26 6 40 5" fill="none" stroke="#F5EEE2" stroke-width=".7" opacity=".5"/>
    </pattern>
    <pattern id="speck" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r=".7" fill="#F5EEE2" opacity=".6"/><circle cx="6" cy="6" r=".5" fill="#F5EEE2" opacity=".5"/>
    </pattern>
  </defs>
  <rect width="450" height="300" fill="#F5EEE2"/>
