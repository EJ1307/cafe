      <path d="M24 49h6v7h-6ZM60 49h6v7h-6ZM104 49h6v7h-6ZM126 61h6v7h-6ZM166 61h6v7h-6ZM208 61h6v7h-6ZM230 55h6v7h-6ZM274 55h6v7h-6ZM316 55h6v7h-6ZM338 45h6v7h-6ZM378 45h6v7h-6ZM418 45h6v7h-6Z"/>
