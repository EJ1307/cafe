<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <title>Arabica, Baba Budangiri — linocut by Theo Abernathy-Ruiz</title>
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2.6"/>
    </filter>
    <pattern id="ink-tex" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r=".6" fill="#F4EDE0" opacity=".55"/><circle cx="7" cy="7" r=".5" fill="#F4EDE0" opacity=".45"/>
    </pattern>
  </defs>
  <rect width="300" height="400" fill="#F4EDE0"/>
  <g filter="url(#rough)">
    <!-- the inked block -->
    <rect x="30" y="30" width="240" height="310" fill="#1C1A17"/>
    <!-- gouge marks in the background -->
    <g stroke="#F4EDE0" stroke-width="1.6" stroke-linecap="round" fill="none">
      <path d="M44 52l10 4M48 66l12 3M40 300l14-2M52 318l10-4M244 48l12 6M236 62l14 2M250 300l8 10M228 320l14 4M42 210l8 6M254 160l8-6M248 180l10-2"/>
      <path d="M40 120c6 4 10 4 16 2M246 236c4 6 8 8 14 8M60 330c8-2 14-2 20 2"/>
    </g>
    <!-- branch -->
    <path d="M70 330C96 286 118 246 150 206S214 120 240 54" fill="none" stroke="#F4EDE0" stroke-width="7" stroke-linecap="round"/>
    <path d="M70 330C96 286 118 246 150 206S214 120 240 54" fill="none" stroke="#1C1A17" stroke-width="2" stroke-dasharray="6 9" stroke-linecap="round"/>
    <!-- leaves carved out of the block, veins left standing -->
    <g fill="#F4EDE0">
      <path d="M118 250C80 250 52 226 46 190C84 186 112 210 118 250Z"/>
      <path d="M152 204C176 168 206 156 240 162C226 196 192 214 152 204Z"/>
      <path d="M182 140C150 120 136 90 142 58C172 72 188 102 182 140Z"/>
      <path d="M102 286C120 254 146 240 176 244C166 274 138 292 102 286Z"/>
      <path d="M214 96C228 70 248 58 270 58C264 84 244 98 214 96Z"/>
    </g>
    <g fill="none" stroke="#1C1A17" stroke-width="1.8" stroke-linecap="round">
      <path d="M116 246C96 232 78 214 58 196M96 230l-8 12M84 218l-10 8M104 238l-4 12M76 208l-12 2"/>
      <path d="M156 202C180 188 204 176 232 166M178 190l2-14M196 182l6-14M214 174l4-12M188 186l10 8M208 178l10 6"/>
      <path d="M180 136C170 112 158 90 146 66M170 112l-14 2M162 98l-12 -2M174 124l12 -4M156 84l10-6"/>
      <path d="M106 282C124 270 146 258 170 248M126 270l-2 -12M146 260l0 -12M138 266l10 8"/>
      <path d="M218 94C234 84 250 72 264 62M236 82l-2-10M250 72l2-8"/>
    </g>
  </g>
  <!-- second block: cherries in red, printed on top -->
  <g filter="url(#rough)">
    <g fill="#B8432A">
      <circle cx="140" cy="222" r="11"/><circle cx="158" cy="230" r="10"/><circle cx="146" cy="240" r="10.5"/>
      <circle cx="196" cy="152" r="9.5"/><circle cx="210" cy="160" r="9"/><circle cx="200" cy="168" r="9.5"/>
      <circle cx="100" cy="302" r="9"/><circle cx="114" cy="308" r="8.5"/>
    </g>
    <g fill="none" stroke="#F4EDE0" stroke-width="1.6" stroke-linecap="round">
      <path d="M134 216c3-3 6-4 9-3M153 225c3-3 5-3 8-2M141 235c2-3 5-4 8-3M191 147c3-3 5-3 8-2M205 155c2-2 5-3 7-2M195 163c3-2 5-3 7-2M96 297c2-3 5-3 7-2"/>
    </g>
  </g>
  <rect x="30" y="30" width="240" height="310" fill="url(#ink-tex)"/>
  <text x="30" y="368" font-family="Georgia, serif" font-style="italic" font-size="9" fill="#8A8273">2/20</text>
  <text x="270" y="368" text-anchor="end" font-family="Georgia, serif" font-style="italic" font-size="9" fill="#8A8273">T. Abernathy-Ruiz</text>
</svg>
