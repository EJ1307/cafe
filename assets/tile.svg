<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <g id="arm">
      <!-- lattice: quarter circles around each corner -->
      <path d="M50 0A50 50 0 0 1 0 50" fill="none" stroke="#1F3A93" stroke-width="3.2"/>
      <path d="M41 0A41 41 0 0 1 0 41" fill="none" stroke="#1F3A93" stroke-width="1.4"/>
      <circle cx="35.36" cy="35.36" r="3.4"/>
      <!-- corner rosette (completes across four tiles) -->
      <path d="M0 0C9 2 17 9 22 22C9 17 2 9 0 0Z"/>
      <circle cx="0" cy="0" r="8"/>
      <circle cx="0" cy="0" r="3.4" fill="#F8F3EA"/>
      <circle cx="25" cy="0" r="2.6"/>
      <circle cx="0" cy="25" r="2.6"/>
      <!-- edge bead where the lattice circles kiss -->
      <circle cx="50" cy="0" r="5"/>
      <!-- centre flower: one long and one short petal per arm -->
      <path d="M50 41C57 34 58 23 50 12C42 23 43 34 50 41Z"/>
      <path d="M50 37C47 31 47 23 50 18" fill="none" stroke="#F8F3EA" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M50 41C54 37 54 32 50 27C46 32 46 37 50 41Z" transform="rotate(-45 50 50)"/>
    </g>
  </defs>
  <rect width="100" height="100" fill="#F8F3EA"/>
  <path d="M50 0A50 50 0 0 0 100 50A50 50 0 0 0 50 100A50 50 0 0 0 0 50A50 50 0 0 0 50 0Z" fill="#D9E0F1"/>
  <g fill="#1F3A93">
    <use xlink:href="#arm"/>
    <use xlink:href="#arm" transform="rotate(90 50 50)"/>
    <use xlink:href="#arm" transform="rotate(180 50 50)"/>
    <use xlink:href="#arm" transform="rotate(270 50 50)"/>
    <circle cx="50" cy="50" r="7.5"/>
    <circle cx="50" cy="50" r="3" fill="#F8F3EA"/>
  </g>
</svg>
